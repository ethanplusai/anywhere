name: Feature request
description: Suggest something Anywhere should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what gets in the way, before the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP tools and agent behaviour
        - Web app
        - Page layout and the skill
        - The anywr command
        - Self-hosting
        - Something else
